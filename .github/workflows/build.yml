name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build
        run: gradle assembleRelease --no-daemon 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Prepare APK
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          cp app/build/outputs/apk/release/app-release.apk Koackpit.apk
          # Appli compagnon : extension .bin pour que les anciennes versions ne la prennent pas pour Koackpit
          cp updater/build/outputs/apk/release/updater-release.apk KoackpitUpdater.bin

      - uses: actions/upload-artifact@v4
        with:
          name: Koackpit-${{ env.VERSION }}
          path: |
            Koackpit.apk
            KoackpitUpdater.bin

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Koackpit ${{ env.VERSION }}
          files: |
            Koackpit.apk
            KoackpitUpdater.bin
          make_latest: true

      - name: Report
        if: always()
        run: |
          RESULT="${{ job.status }}"
          mkdir -p /tmp/report
          echo "$RESULT ${GITHUB_SHA}" > /tmp/report/status.txt
          if [ -f build.log ]; then
            grep -E "^e: |error:|FAILURE|FAILED|Test.*>|AssertionError|Expected|What went wrong|BUILD (SUCCESSFUL|FAILED)|\.kt:[0-9]+|\.xml:[0-9]+|AAPT|Could not" build.log | head -200 > /tmp/report/errors.txt || true
            tail -150 build.log > /tmp/report/tail.txt
          fi
          for f in app/build/test-results/testDebugUnitTest/*.xml; do [ -f "$f" ] && grep -o '<testsuite [^>]*>' "$f"; grep -o '<testcase name="[^"]*"' "$f"; grep -A3 '<failure' "$f" | head -20; done > /tmp/report/tests.txt 2>/dev/null || true
          cd /tmp/report
          git init -q -b build-logs
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "$RESULT ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-logs
