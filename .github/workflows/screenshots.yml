name: Screenshots

# Dessine les écrans de Koackpit au format de l'autoradio (1024×600), sans la voiture.
on:
  push:
    branches: [main, 'ui-*']
    paths: ['app/src/**', 'app/build.gradle.kts', '.github/workflows/screenshots.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Render
        run: gradle :app:testDebugUnitTest --tests 'com.koala.koackpit.Screenshots' --no-daemon 2>&1 | tee screens.log; exit ${PIPESTATUS[0]}
      - name: Publish
        if: always()
        run: |
          mkdir -p /tmp/out
          cp app/build/screens/*.png /tmp/out/ 2>/dev/null || true
          grep -E "^e: |error:|FAILED|What went wrong|Could not|Exception" screens.log | head -80 > /tmp/out/errors.txt || true
          echo "${{ job.status }} ${GITHUB_SHA}" > /tmp/out/status.txt
          cd /tmp/out
          git init -q -b screenshots
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "screens ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots
