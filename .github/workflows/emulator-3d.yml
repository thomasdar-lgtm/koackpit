name: Emulator 3D

# Vraie vue 3D (Filament) sur un émulateur Android 10 : captures poussées sur la branche screenshots-3d.
on:
  push:
    branches: ['ui-3d*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build debug
        run: gradle :app:assembleDebug --no-daemon 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_c
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: sh .github/emu-3d.sh
      - name: Publish
        if: always()
        run: |
          mkdir -p /tmp/out
          cp emu/* /tmp/out/ 2>/dev/null || true
          grep -E "^e: |error:|FAILED|What went wrong|Could not" build.log | head -60 > /tmp/out/errors.txt || true
          echo "${{ job.status }} ${GITHUB_SHA}" > /tmp/out/status.txt
          cd /tmp/out
          git init -q -b screenshots-3d
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "emu ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots-3d
